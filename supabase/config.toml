# Build Ultra — Supabase local / deploy config
# Disable gateway JWT verification for `chat` so the function validates the user JWT in code
# (avoids 401 from the API gateway with publishable keys / custom auth flows).
[functions.chat]
verify_jwt = false

# Stripe calls this endpoint with Stripe-Signature, not Supabase JWT.
[functions.stripe-webhook]
verify_jwt = false

# JWT is validated inside the function (Bearer from the extension).
[functions.embed]
verify_jwt = false

[functions.log-usage]
verify_jwt = false
